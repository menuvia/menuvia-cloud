[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Healthcheck extern (dead-man's-switch) — path frumos /health rutat la funcție.
# TREBUIE înainte de catch-all-ul /* → /index.html (first-match wins), altfel SPA
# shell-ul l-ar înghiți. Monitoarele de uptime (UptimeRobot etc.) lovesc /health.
[[redirects]]
  from   = "/health"
  to     = "/.netlify/functions/health"
  status = 200

# Sitemap dinamic (treapta 2 Google) — ÎNAINTEA catch-all-ului /*.
[[redirects]]
  from   = "/sitemap.xml"
  to     = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

# ── Scheduled functions (cron) ─────────────────────────────────
# BUGET DE INVOCĂRI (incident aug 2026: cron-urile au fost suspendate de
# Netlify pe planul Free — vezi postmortem în docs/RUNBOOK.md). Cu zero
# clienți, fiecare tick pe o coadă goală costă cotă degeaba. Programările de
# mai jos sunt REGIMUL DE AVARIE (~20k invocări/lună, era ~49k); fiecare
# funcție are notat în comentariu pragul la care se accelerează înapoi.
# ATENȚIE: automation-cron NU se rărește sub */15 — gate-urile interne
# (ferestre `minute < 15`, cleanup zilnic la 03:15-03:30) presupun tick la
# 15 min; la */30 jobul de cleanup nu s-ar mai declanșa NICIODATĂ.

# La 5 min: process queued emails. Rămâne la 5 min — e coada operațională
# (notificarea de rezervare nouă către owner trebuie să ajungă repede).
[functions."process-email-queue"]
  schedule = "*/5 * * * *"

# Every 15 min: lifecycle events + (every 30min) health scores + (Fri 18:00) weekly reports
[functions."automation-cron"]
  schedule = "*/15 * * * *"

# La 15 min: process Oblio invoice queue. Era la 2 min (21.600 invocări/lună —
# 44% din tot bugetul) pentru o coadă care n-a avut NICIODATĂ un rând real
# (zero clienți plătitori, Stripe n-a procesat nimic). Factura Oblio emisă la
# 15 min după invoice.paid rămâne „în aceeași zi" fiscal. La primul client
# plătitor: coboară la "*/5 * * * *".
[functions."oblio-generator"]
  schedule = "*/15 * * * *"

# La 30 min: claim reservation reminders + enqueue în email_queue. Reminderele
# au lead time de ORE înaintea rezervării — granularitatea de 30 min mută
# trimiterea cu max. 30 min, imperceptibil. La volum real de rezervări:
# înapoi la "*/10 * * * *".
[functions."send-reservation-reminders"]
  schedule = "*/30 * * * *"

# La 5 min după compute_health_scores (rulează prin automation-cron DOAR la
# :00/:30 — gate-ul intern e pe 30 min, nu pe 15): atomic-claim scoruri
# critice → POST Slack webhook. Tick-urile de la :20/:50 erau no-op garantat
# (niciun scor nou de la :05/:35) — tăiate. Skip silent dacă
# SLACK_WEBHOOK_URL nu e setat.
[functions."send-health-slack-alerts"]
  schedule = "5,35 * * * *"

# La 15 min: process queued SMS (mig 228). Era la 1 min, apoi 5 min — auditul
# de infra (aug 2026) a arătat că tick-ul „ieftin" costă COTĂ pentru o coadă
# goală (zero clienți SMS). La primul client cu SMS activ, „pickup gata"
# redevine time-sensitive: coboară înapoi la "* * * * *" (o linie).
[functions."process-sms-queue"]
  schedule = "*/15 * * * *"

# Security headers — A+ grade on securityheaders.com
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Cross-Origin policies (relevant pentru Stripe/Supabase popups)
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # CSP în Report-Only mode pentru 2-4 săptămâni — monitorizare în Sentry
    # După ce nu mai vin violations, mută la `Content-Security-Policy` (enforce)
    Content-Security-Policy-Report-Only = '''
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.posthog.com https://*.sentry.io https://www.googletagmanager.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https://*.supabase.co https://*.googleusercontent.com https://*.googleapis.com;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.posthog.com https://*.sentry.io https://api.anthropic.com;
      frame-src 'self' https://js.stripe.com https://hooks.stripe.com;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self' https://*.stripe.com;
      frame-ancestors 'none';
      upgrade-insecure-requests;
    '''

# ── Assets cu hash de conținut (app.[hash].js/css, imagini bundle-uite) ──
# Vite scrie nume content-addressed în /assets/ → sigur de cache-uit „forever".
# `immutable` sare complet revalidarea: la reîncărcarea meniului (client care
# revine la local) fișierele vin din cache local, zero request pe 4G/wifi de
# restaurant. Un deploy nou schimbă hash-ul → URL nou, deci fără risc de stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── SW + manifest no-cache headers (fresh on every load) ──────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ═══════════════════════════════════════════════════════════════
# BRANCH CONTEXTS — staging vs production
# ═══════════════════════════════════════════════════════════════
# Push pe main         → deploy la menuvia.ro (production)
# Push pe develop      → deploy la staging.menuvia.ro (staging — separate Supabase project)
# PR-uri               → preview URL automat (deploy-preview-NN--menuvia.netlify.app)
#
# IMPORTANT: în Netlify Dashboard → Site settings → Build & deploy → Branches:
#   - Production branch:  main
#   - Branch deploys:     develop, feature/*
#   - Deploy previews:    Any pull request

# ── Production (main) ──────────────────────────────────────────
[context.production.environment]
  VITE_APP_ENV    = "production"
  VITE_APP_URL    = "https://menuvia.ro"
  # VITE_SUPABASE_URL și VITE_SUPABASE_ANON_KEY sunt setate în Netlify UI
  # pentru contextul "production" — pointing la project Supabase prod

# ── Staging (develop branch) ───────────────────────────────────
[context.branch-deploy.environment]
  VITE_APP_ENV    = "staging"
  VITE_APP_URL    = "https://staging.menuvia.ro"
  # VITE_SUPABASE_URL_DEV pointing la project Supabase dev/staging

# Specifically for develop branch
[context."develop".environment]
  VITE_APP_ENV    = "staging"
  VITE_APP_URL    = "https://staging.menuvia.ro"

# ── Deploy previews (PRs) ──────────────────────────────────────
[context.deploy-preview.environment]
  VITE_APP_ENV    = "preview"
  # Folosește implicit URL-ul deploy-preview din Netlify
  # (deploy-preview-N--menuvia.netlify.app)
  # Conectează la Supabase dev — NU la prod, niciodată

