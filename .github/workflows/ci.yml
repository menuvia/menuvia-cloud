name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Anulează run-uri vechi pe același branch când vine push nou — economisește
# minute CI și accelerează feedback-ul pe ultimul commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + TS + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Security audit (prod deps only, block high+critical)
        # Auditează DOAR deps de production — care ajung în bundle-ul shipped.
        # Dev tooling (vitest/vite/@typescript-eslint) e zgomot — vulnerabili-
        # tățile lor nu ating userii finali, doar build pipeline.
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build app
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Run E2E tests
        env:
          E2E_EMAIL:    ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse mobile ≥ 90 (public menu)
    runs-on: ubuntu-latest
    needs: lint-and-build
    # Advisory: în CI pagina /m/tinctura rulează cu backend Supabase placeholder,
    # deci randează empty-state ("Restaurant negăsit"), iar scorul nu e
    # reprezentativ pentru meniul real. Raportul se încarcă ca artifact, dar
    # job-ul NU blochează PR-ul. Gate-ul real Lighthouse rulează pe deploy
    # preview-ul Netlify (cu backend + restaurant seed-uit).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Build app (stub Supabase env)
        env:
          # URL fictiv dar valid ca format — aplicația trebuie să se construiască
          # și pagina publică să randeze fără backend (loading state / empty state)
          VITE_SUPABASE_URL:      "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.placeholder"
        run: npm run build

      - name: Serve static build
        run: npx serve dist -p 4173 &
        # Pornim un server static în fundal; Lighthouse îl va ataca

      - name: Wait for server
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:4173 > /dev/null; then echo "Server ready"; break; fi
            sleep 1
          done

      - name: Run Lighthouse (mobile)
        run: |
          npx lighthouse http://localhost:4173/m/tinctura \
            --output=json \
            --output-path=lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --preset=perf \
            --form-factor=mobile \
            --screenEmulation.width=375 \
            --screenEmulation.height=812 \
            --screenEmulation.deviceScaleFactor=2 \
            --throttling-method=simulate \
            --only-categories=performance 2>/dev/null || true

      - name: Assert performance score ≥ 90
        run: |
          SCORE=$(node -e "
            const r = require('./lighthouse-report.json');
            const s = Math.round(r.categories.performance.score * 100);
            console.log(s);
          ")
          echo "Lighthouse mobile performance score: $SCORE"
          if [ "$SCORE" -lt 90 ]; then
            echo "❌ Score $SCORE < 90 — Gate A exit criteria NOT met."
            echo "   Fix: reduce initial bundle, improve CLS/LCP on PublicMenuPage."
            exit 1
          fi
          echo "✅ Score $SCORE ≥ 90 — Gate A passed."

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 14
