name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Anulează run-uri vechi pe același branch când vine push nou — economisește
# minute CI și accelerează feedback-ul pe ultimul commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + TS + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Security audit (prod deps only, block high+critical)
        # Auditează DOAR deps de production — care ajung în bundle-ul shipped.
        # Dev tooling (vitest/vite/@typescript-eslint) e zgomot — vulnerabili-
        # tățile lor nu ating userii finali, doar build pipeline.
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

  e2e:
    # ERMETIC: rulează contra unui stack Supabase LOCAL (supabase start aplică
    # toate migrațiile din supabase/migrations/), user E2E creat prin GoTrue
    # admin API (trigger-ul handle_new_user creează profilul), apoi seed-ul
    # Tinctura îl folosește ca owner. ZERO secrets — repară cronic-roșul istoric
    # (build cu env gol → supabase-js crăpa la init → toate spec-urile picau).
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-and-build
    env:
      SUPABASE_LOCAL_URL: http://127.0.0.1:54321
      E2E_EMAIL: e2e-owner@menuvia.test
      E2E_PASSWORD: MenuviaE2E-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Pornim stack-ul FĂRĂ auto-migrații: pe local, default privileges acordă
      # ALL lui service_role pe tabele noi (ca pe cloud), iar asserția fail-closed
      # din mig 096B (corectă) ar pica la replay-from-zero — pe prod a trecut
      # pentru că acolo privilegiile erau deja curate. Revocăm default-urile
      # pentru service_role ÎNAINTE de a aplica migrațiile (echivalent cu prod),
      # fără să atingem migrațiile aplicate (regula: nu se editează).
      - name: Start local Supabase (fără auto-migrații)
        run: |
          sed -i '/^\[db\.migrations\]$/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
          supabase start

      - name: Pre-curățare privilegii service_role (paritate cu prod)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          alter default privileges for role postgres in schema public
            revoke insert, update, delete, references, truncate, trigger on tables from service_role;
          alter default privileges in schema public
            revoke insert, update, delete, references, truncate, trigger on tables from service_role;
          SQL

      # psql, nu `supabase migration up`: mig 120/121 conțin meta-comenzi psql
      # (\set ON_ERROR_STOP) pe care runner-ul CLI nu le înțelege. Același
      # aplicator ca sql-verify.yml (calea deja dovedită).
      - name: Apply migrations (001→201, via psql)
        run: |
          for f in supabase/migrations/*.sql; do
            echo "── $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Export local keys
        id: sb
        run: |
          # CLI v1 exportă ANON_KEY/SERVICE_ROLE_KEY; v2 le prefixează cu SUPABASE_.
          eval "$(supabase status -o env | grep -E '^(SUPABASE_)?(ANON_KEY|SERVICE_ROLE_KEY)=')"
          echo "anon=${ANON_KEY:-$SUPABASE_ANON_KEY}" >> "$GITHUB_OUTPUT"
          echo "service=${SERVICE_ROLE_KEY:-$SUPABASE_SERVICE_ROLE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Create E2E owner user (GoTrue admin → trigger creează profilul)
        run: |
          curl -sf -X POST "$SUPABASE_LOCAL_URL/auth/v1/admin/users" \
            -H "apikey: ${{ steps.sb.outputs.service }}" \
            -H "Authorization: Bearer ${{ steps.sb.outputs.service }}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\",\"email_confirm\":true}"

      - name: Seed Tinctura demo (owner = userul E2E)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/scripts/seed_tinctura_demo.sql

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build app (contra stack-ului local)
        env:
          VITE_SUPABASE_URL:      ${{ env.SUPABASE_LOCAL_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.sb.outputs.anon }}
        run: npm run build

      - name: Run E2E tests
        env:
          VITE_SUPABASE_URL:      ${{ env.SUPABASE_LOCAL_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.sb.outputs.anon }}
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    # Numele spune explicit "advisory" — un check verde aici NU certifică
    # scorul ≥ 90 (criteriul blocking din spec rămâne datorie pentru Gate F,
    # când CI va avea backend seed-uit).
    name: Lighthouse mobile (advisory, public menu)
    runs-on: ubuntu-latest
    needs: lint-and-build
    # Advisory: în CI pagina /m/tinctura rulează cu backend Supabase placeholder,
    # deci randează empty-state ("Restaurant negăsit"), iar scorul nu e
    # reprezentativ pentru meniul real. Raportul se încarcă ca artifact, dar
    # job-ul NU blochează PR-ul. Gate-ul real Lighthouse rulează pe deploy
    # preview-ul Netlify (cu backend + restaurant seed-uit).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Build app (stub Supabase env)
        env:
          # URL fictiv dar valid ca format — aplicația trebuie să se construiască
          # și pagina publică să randeze fără backend (loading state / empty state)
          VITE_SUPABASE_URL:      "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.placeholder"
        run: npm run build

      - name: Serve static build
        run: npx serve dist -p 4173 &
        # Pornim un server static în fundal; Lighthouse îl va ataca

      - name: Wait for server
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:4173 > /dev/null; then echo "Server ready"; break; fi
            sleep 1
          done

      - name: Run Lighthouse (mobile)
        run: |
          npx lighthouse http://localhost:4173/m/tinctura \
            --output=json \
            --output-path=lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --preset=perf \
            --form-factor=mobile \
            --screenEmulation.width=375 \
            --screenEmulation.height=812 \
            --screenEmulation.deviceScaleFactor=2 \
            --throttling-method=simulate \
            --only-categories=performance 2>/dev/null || true

      - name: Report performance score (advisory)
        run: |
          # Advisory: în CI pagina rulează fără backend real, deci scorul nu e
          # reprezentativ și NU blocăm PR-ul. Raportăm scorul informativ; gate-ul
          # real ≥90 se evaluează pe deploy preview-ul Netlify cu backend.
          SCORE=$(node -e "
            try {
              const r = require('./lighthouse-report.json');
              const s = r.categories?.performance?.score;
              console.log(s == null ? 'n/a' : Math.round(s * 100));
            } catch (e) { console.log('n/a'); }
          ")
          echo "Lighthouse mobile performance score (advisory): $SCORE"
          if [ "$SCORE" != "n/a" ] && [ "$SCORE" -lt 90 ] 2>/dev/null; then
            echo "⚠️  Score $SCORE < 90 în CI (empty-state, fără backend) — verifică pe deploy preview."
          fi

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 14
