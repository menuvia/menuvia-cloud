name: Regenerate lockfile

# Regenerează package-lock.json pe un branch dat, cu registry-ul REAL al
# runner-ului (mediul de agent nu are acces la registry.npmjs.org, deci
# lockfile-ul nu se poate reconcilia local). Cazul tipic: un branch dependabot
# de grup intră în conflict de lockfile cu main după merge-ul altui PR de
# dependențe — package.json se rezolvă manual (chei disjuncte), lockfile-ul se
# ia din main ca placeholder stale, iar jobul acesta îl reconciliază cu
# `npm install --package-lock-only` și împinge commit-ul.
#
# ATENȚIE: push-ul cu GITHUB_TOKEN NU declanșează workflow-urile de CI —
# după rulare, pornește manual „CI" și „Tests & Quality" pe branch
# (ambele au workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch-ul pe care se regenerează package-lock.json'
        required: true
        type: string

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Reconciliază lockfile-ul cu package.json
        # --package-lock-only: nu instalează nimic, doar rezolvă arborele;
        # --ignore-scripts: fără lifecycle scripts (husky etc.) pe runner.
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit + push dacă s-a schimbat
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile-ul era deja reconciliat — nimic de împins."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(lock): reconciliază package-lock.json cu package.json (regenerate-lockfile)"
          git push origin "HEAD:${{ inputs.branch }}"
