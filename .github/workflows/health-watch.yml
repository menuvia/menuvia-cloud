# Dead-man's-switch PROVIZORIU (audit aug 2026): /health există și detectează
# cron-ul mort (incident 2–19 aug, de două ori câte 7+ zile invizibil), dar
# NIMENI nu-l lovea din afară — monitorul extern (UptimeRobot, pasul 0.4 din
# PLAN_0_TO_HERO) e tot neinstalat. Până apare, acest workflow bate /health
# la 30 min și pică ROȘU (= email de la GitHub către fondator) pe orice non-200.
#
# ⚠️ Limitări cunoscute, deliberat acceptate pentru un stopgap:
#   - GitHub dezactivează cron-urile după 60 de zile fără activitate în repo.
#   - Rulează doar pe branch-ul default și are jitter de minute.
#   - NU înlocuiește UptimeRobot (5 min, alertă push) — doar acoperă golul.
# Când UptimeRobot e instalat și verificat, șterge acest fișier.
#
# ORDINEA E PORTANTĂ (recenzie adversarială mig 274): sondele se citesc și se
# raportează ÎNAINTE de a ieși pe non-200. Înainte, `exit 1` venea PRIMUL, deci
# pe un 503 (starea de azi: Netlify mort → db down) niciun `::warning::` și
# niciun `::error::` per sondă nu se mai emitea — schema=behind, queues=unknown
# și pgcron=* erau ÎNGROPATE sub „a întors 503", iar documentația care spunea că
# health-watch „pică roșu pe schema:behind" descria un cod mort.
name: Health watch (stopgap)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe /health
        env:
          # Schimbă la https://menuvia.ro/health după cumpărarea domeniului.
          HEALTH_URL: https://menuvia.netlify.app/health
          # Secretul din env-ul Netlify (RUNBOOK §4.1). Cu el, /health întoarce și
          # `config.*` (ce integrări au cheie), iar acest workflow poate alerta pe
          # o cheie LIPSĂ/revocată — până la măturarea din 16 sept 2026 RUNBOOK
          # afirma că health-watch face asta, dar workflow-ul nu trimitea antetul
          # (documentație care minte, OPS-15). Fără secret setat: comportamentul
          # public de dinainte, plus un avertisment că alarma pe config e oarbă.
          HEALTH_DIAG_TOKEN: ${{ secrets.HEALTH_DIAG_TOKEN }}
        run: |
          set +e
          # rc-ul se ia IMEDIAT după curl, în fiecare ramură: după un `echo` de
          # avertisment, `$?` ar fi 0 și un curl picat ar trece drept „verde".
          if [ -n "$HEALTH_DIAG_TOKEN" ]; then
            body="$(curl -sS --max-time 20 -H "x-health-diag: $HEALTH_DIAG_TOKEN" -w '\n%{http_code}' "$HEALTH_URL")"
            rc=$?
          else
            body="$(curl -sS --max-time 20 -w '\n%{http_code}' "$HEALTH_URL")"
            rc=$?
            echo "::warning::HEALTH_DIAG_TOKEN nu e setat în GitHub Secrets — alarma pe config.* (chei lipsă/revocate) e OARBĂ. Setează același token ca în env-ul Netlify."
          fi
          code="$(echo "$body" | tail -1)"
          payload="$(echo "$body" | head -n -1)"
          echo "HTTP $code de la $HEALTH_URL"
          # În log tipărim DOAR partea publică {status, checks} (audit v3 RES-38):
          # cu token, corpul mai conține storage_detail (nume de tabele, octeți),
          # queue_detail (volum de business) — n-au ce căuta într-un log de CI.
          echo "$payload" | sed -n 's/.*\("checks":{[^}]*}\).*/\1/p'
          # Alerta pe integrări: orice `config.<x>: false` = cheie lipsă sau
          # revocată în env-ul de producție (issue #250 e exact starea „toate false").
          if [ -n "$HEALTH_DIAG_TOKEN" ] && [ "$code" = "200" ]; then
            cfg="$(echo "$payload" | sed -n 's/.*"config":{\([^}]*\)}.*/\1/p')"
            if [ -n "$cfg" ]; then
              echo "config: $cfg"
              for k in $(echo "$cfg" | tr ',' '\n' | sed -n 's/^"\([a-z_]*\)":false$/\1/p'); do
                echo "::error::/health raportează config.$k=false — cheia integrării '$k' LIPSEȘTE sau e revocată în env-ul Netlify (RUNBOOK §5, docs/VPS_RUNBOOK.md)."
                cfg_fail=1
              done
            else
              # Am trimis antetul și n-am primit `config` → token greșit/rotit în
              # Netlify, deploy fără suport de diag sau formă schimbată. Oricare ar
              # fi, alarma pe integrări e OARBĂ — și un verde aici ar fi exact
              # gate-ul mort (recenzie CodeRabbit #262). Se tratează ca eșec.
              echo "::error::Antetul x-health-diag a fost trimis, dar /health NU a întors \`config\` — HEALTH_DIAG_TOKEN din GitHub nu coincide cu cel din env-ul Netlify (sau deploy-ul nu are diag). Alarma pe integrări e OARBĂ."
              cfg_fail=1
            fi
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::/health inaccesibil (curl rc=$rc) — site-ul sau funcțiile Netlify sunt CĂZUTE."
            exit 1
          fi

          # 1) Citim TOATE sondele întâi, indiferent de codul HTTP.
          sonda() { echo "$payload" | sed -n "s/.*\"$1\":\"\([a-z]*\)\".*/\1/p"; }
          db="$(sonda db)"
          cron="$(sonda cron)"
          storage="$(sonda storage)"
          schema="$(sonda schema)"
          queues="$(sonda queues)"
          pgcron="$(sonda pgcron)"
          echo "sonde: db=${db:-n/a} cron=${cron:-n/a} storage=${storage:-n/a} schema=${schema:-n/a} queues=${queues:-n/a} pgcron=${pgcron:-n/a}"

          # 2) Raportăm fiecare semnal pe canalul lui, ÎNAINTE de verdict.
          fail="${cfg_fail:-0}"
          # Sondele tolerante (storage/schema/queues/pgcron) NU influențează codul
          # de status pe `unknown` (toleranță deliberată: clientul se poate deploya
          # înaintea migrației). Dar după ce mig 266/271/274 sunt aplicate,
          # `unknown` nu mai înseamnă „se deployează", ci „sonda e MOARTĂ" — RPC
          # șters, EXECUTE revocat, cheie schimbată — și alarma respectivă tace
          # pentru totdeauna cu HTTP 200. O observăm DE AFARĂ, ca tot restul.
          if [ "$db" = "ok" ]; then
            if [ "$storage" = "unknown" ]; then
              echo "::warning::/health raportează storage=unknown deși db=ok — sonda get_database_size() (mig 266) nu răspunde. Alarma de stocare e MOARTĂ: vezi docs/RUNBOOK.md §4.1."
            fi
            if [ "$queues" = "unknown" ]; then
              echo "::warning::/health raportează queues=unknown deși db=ok — sonda get_queue_backlog() (mig 271) nu răspunde. Alarma pe cozi e MOARTĂ: vezi docs/RUNBOOK.md §4.1."
            fi
            if [ "$schema" = "unknown" ]; then
              echo "::warning::/health raportează schema=unknown deși db=ok — sonda get_schema_version() (mig 271) nu răspunde (neaplicată încă sau moartă)."
            fi
            if [ "$pgcron" = "unknown" ]; then
              echo "::warning::/health raportează pgcron=unknown deși db=ok — sonda get_cron_janitor_health() (mig 274) nu răspunde. Alarma pe janitoarele din DB e MOARTĂ: vezi docs/RUNBOOK.md §4.1."
            fi
          fi
          if [ "$queues" = "warn" ]; then
            echo "::warning::/health raportează queues=warn — bonuri/tichete pending >15 min la un restaurant (bridge-ul lui e probabil oprit; alarma per-tenant e bannerul mig 265)."
          fi
          # Janitoarele pg_cron (mig 274): `warming` e normal în primele ore după
          # aplicare și e SINGURUL semnal timpuriu că worker-ul pg_cron nu se
          # conectează (devine `stale`, adică 503, după max_age_s). `failing` =
          # ultima rulare a eșuat, dar mai e o reușită în fereastră. `absent` =
          # extensia a DISPĂRUT după ce migrația a instalat-o (toggle Dashboard,
          # restore, branch reset) — regresie de configurare, cu cale de întoarcere
          # în docs/RUNBOOK.md §4.1.
          if [ "$pgcron" = "warming" ]; then
            echo "::warning::/health raportează pgcron=warming — joburile din manifest sunt programate dar NU au nicio reușită în cron.job_run_details. Normal în primele ore după mig 274; persistent = worker-ul pg_cron nu rulează joburile."
          fi
          if [ "$pgcron" = "failing" ]; then
            echo "::warning::/health raportează pgcron=failing — ultima rulare a cel puțin unui janitor pg_cron a EȘUAT (mai există o reușită în fereastră). Detaliul: curl cu x-health-diag → pgcron_detail; istoricul: select * from cron.job_run_details order by runid desc."
          fi
          if [ "$pgcron" = "absent" ]; then
            echo "::warning::/health raportează pgcron=absent — extensia pg_cron NU mai e instalată deși mig 274 a instalat-o. Janitoarele fiscale din DB NU rulează. Re-activează pg_cron (Dashboard → Database → Extensions) și re-aplică mig 274 (e re-rulabilă)."
          fi
          # Decalajul de schemă e EXACT starea RES-08 („am reparat, dar nu apără"):
          # repo-ul are migrații pe care prod-ul nu le are. Nu e un 503 (deploy-ul
          # înaintea migrației e un tranzit legitim), dar e singurul canal care
          # trimite email azi — nag la 30 min până la aplicare e intenționat.
          if [ "$schema" = "behind" ]; then
            echo "::error::/health raportează schema=behind — există migrații în repo NEAPLICATE pe producție. Aplică-le (Supabase MCP apply_migration / SQL Editor) — vezi docs/RUNBOOK.md §4.1; lista exactă: curl cu x-health-diag."
            fail=1
          fi

          # 3) Verdictul, cu sondele deja tipărite deasupra lui.
          if [ "$code" != "200" ]; then
            echo "::error::/health a întors $code — db=${db:-n/a} cron=${cron:-n/a} storage=${storage:-n/a} queues=${queues:-n/a} pgcron=${pgcron:-n/a}. Semnificații: db down / cron Netlify STALE / stocare critică / cozi STALE / janitoarele pg_cron în drift sau stale (plasele fiscale din mig 262 nu rulează). Vezi docs/RUNBOOK.md §Incident; detaliul: curl cu x-health-diag."
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "✓ health OK (db + cron în parametri; storage=${storage:-n/a} schema=${schema:-n/a} queues=${queues:-n/a} pgcron=${pgcron:-n/a})"
