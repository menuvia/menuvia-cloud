name: SQL Migrations Verify

# Rulează la fiecare PR ce atinge migrații. Aplică toate migrațiile pe PostgreSQL
# temporar pentru a prinde bug-uri sintactice + dependențe înainte de a ajunge
# pe Supabase real. Asta ar fi prins, de exemplu:
#   - migration-025 cu pickup în CHECK constraint dar fără ALTER TYPE
#   - migration-046 v1 cu SELECT short_id din coloană inexistentă

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/**.sql'
      - 'tests/sql/**/*.sql'
      - 'scripts/**/*.sql'
      - '.github/workflows/sql-verify.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/**.sql'
      - 'tests/sql/**/*.sql'
      - 'scripts/**/*.sql'
      - '.github/workflows/sql-verify.yml'

jobs:
  verify:
    name: Apply all migrations to ephemeral Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menuvia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres ready
        env:
          PGPASSWORD: postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres ready after $i attempts"
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Create Supabase-compatible extensions and roles
        env:
          PGPASSWORD: postgres
        run: |
          # Migrațiile noastre presupun anumite extensii și roluri Supabase.
          # Le creem aici ca să nu eșueze GRANT-urile și extension-urile.
          psql -h localhost -U postgres -d menuvia_test <<EOF
          -- Extensions standard Supabase
          create extension if not exists "uuid-ossp";

          -- Schema 'extensions': Supabase instalează pgcrypto aici, iar
          -- migrațiile apelează calificat extensions.gen_random_bytes(...).
          -- O extensie există o singură dată/DB, deci NU instalăm pgcrypto și
          -- în public — altfel 'with schema extensions' devine no-op și
          -- extensions.gen_random_bytes nu ar exista. gen_random_uuid() e
          -- funcție core PostgreSQL 15, disponibilă fără pgcrypto.
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;

          -- Roles Supabase standard
          do \$\$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role noinherit bypassrls;
            end if;
          end \$\$;

          -- Mock auth schema (Supabase îl oferă, aici îl simulăm minimal)
          create schema if not exists auth;

          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb default '{}'::jsonb,
            created_at timestamptz default now()
          );

          -- Mock auth.uid() — în Supabase real e legat de JWT
          create or replace function auth.uid() returns uuid
            language sql stable as \$\$
              select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
            \$\$;

          -- Mock auth.role()
          create or replace function auth.role() returns text
            language sql stable as \$\$
              select coalesce(current_setting('request.jwt.claim.role', true), 'anon')
            \$\$;

          -- Mock storage schema (Supabase îl oferă). Migrațiile inserează în
          -- storage.buckets, creează policies pe storage.objects și folosesc
          -- storage.foldername(name) pentru a extrage prefixul de folder.
          create schema if not exists storage;

          create table if not exists storage.buckets (
            id                text primary key,
            name              text,
            public            boolean default false,
            file_size_limit   bigint,
            allowed_mime_types text[]
          );

          create table if not exists storage.objects (
            id         uuid primary key default gen_random_uuid(),
            bucket_id  text references storage.buckets(id),
            name       text,
            owner      uuid,
            created_at timestamptz default now()
          );

          -- storage.foldername('a/b/c.png') => {a,b,c.png}
          create or replace function storage.foldername(name text)
            returns text[] language sql immutable as \$\$
              select string_to_array(name, '/')
            \$\$;
          EOF

      - name: Apply all migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          cd supabase/migrations

          # Setul canonic (formatul nou, timestamp) = exact ce aplică Supabase:
          # base_schema + enable_pgcrypto + migration_001..051. Include 047-051
          # (formatul vechi supabase/migration-*.sql era stale, doar 001-046).
          MIGRATIONS=$(ls *.sql 2>/dev/null | sort -V)

          if [ -z "$MIGRATIONS" ]; then
            echo "No migrations found!"
            exit 1
          fi

          echo "Found $(echo "$MIGRATIONS" | wc -l) migrations"
          echo ""

          FAILED=0
          for mig in $MIGRATIONS; do
            echo "─────────────────────────────────────────"
            echo "Applying: $mig"
            echo "─────────────────────────────────────────"

            if psql -h localhost -U postgres -d menuvia_test \
                    -v ON_ERROR_STOP=1 \
                    -f "$mig" 2>&1 | tee "/tmp/$mig.log"; then
              echo "✓ $mig OK"
            else
              echo "✗ $mig FAILED"
              FAILED=1
              # Don't continue past first failure — migrations are ordered
              break
            fi
            echo ""
          done

          if [ "$FAILED" = "1" ]; then
            echo "═══════════════════════════════════════════"
            echo "MIGRATIONS FAILED. Fix above before merge."
            echo "═══════════════════════════════════════════"
            exit 1
          fi

      - name: Verify final schema has expected tables
        env:
          PGPASSWORD: postgres
        run: |
          # Smoke test: tabelele critice trebuie să existe după toate migrațiile
          REQUIRED_TABLES="restaurants tables products orders order_items qr_tokens bridge_devices pending_receipts restaurant_memberships table_sessions restaurant_modules"

          for tbl in $REQUIRED_TABLES; do
            COUNT=$(psql -h localhost -U postgres -d menuvia_test -tA -c \
              "select count(*) from information_schema.tables where table_schema='public' and table_name='$tbl';")
            if [ "$COUNT" != "1" ]; then
              echo "✗ Missing table: $tbl"
              exit 1
            fi
            echo "✓ Table exists: $tbl"
          done

      - name: Verify critical RPC functions exist
        env:
          PGPASSWORD: postgres
        run: |
          REQUIRED_FUNCS="create_order bridge_validate_device bridge_get_pending bridge_claim_receipt bridge_confirm_receipt open_table_session close_session_orders advance_order is_module_enabled set_restaurant_module enforce_feature_for_restaurant"

          for fn in $REQUIRED_FUNCS; do
            COUNT=$(psql -h localhost -U postgres -d menuvia_test -tA -c \
              "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='$fn';")
            if [ "$COUNT" = "0" ]; then
              echo "✗ Missing function: $fn"
              exit 1
            fi
            echo "✓ Function exists: $fn (count: $COUNT)"
          done

      - name: "Gate A assertion: Plan 1 (free/starter) cannot create orders"
        env:
          PGPASSWORD: postgres
        run: |
          # Spec §6 Poarta A: "Test de asserțiune: Plan 1 NU poate crea comenzi"
          # Verificăm că enforce_ordering_enabled() respinge INSERT pe orders
          # pentru restaurante cu plan free/starter (order_qr=false).
          psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 <<'ASSERTION'
          do $$
          declare
            v_owner_id    uuid := gen_random_uuid();
            v_rest_id     uuid := gen_random_uuid();
            v_table_id    uuid := gen_random_uuid();
            v_blocked     boolean := false;
          begin
            -- Setup: user cu plan 'free'
            -- Trigger handle_new_user creează automat profilul (plan='free' default).
            insert into auth.users (id, email) values (v_owner_id, 'test-gate-a@menuvia.ro');

            insert into public.restaurants (id, owner_id, name, slug, city, is_active)
              values (v_rest_id, v_owner_id, 'Test Restaurant Gate A', 'test-gate-a-slug', 'București', true);

            insert into public.tables (id, restaurant_id, name, slug, is_active)
              values (v_table_id, v_rest_id, 'Masa 1', 'masa-1', true);

            -- Setăm auth.uid() la owner (bypass RLS pentru test)
            perform set_config('request.jwt.claim.sub', v_owner_id::text, true);
            perform set_config('request.jwt.claim.role', 'authenticated', true);

            -- Încearcă INSERT pe orders — trigger-ul trebuie să-l respingă
            begin
              insert into public.orders (
                restaurant_id, table_id, source, status, total
              ) values (
                v_rest_id, v_table_id, 'qr', 'new', 0
              );
              -- Dacă ajunge aici, gate-ul NU funcționează
              raise exception 'ASSERTION FAILED: Plan 1 (free) a putut crea o comandă! Gate-ul nu funcționează.';
            exception
              when check_violation then
                v_blocked := true;
                raise notice 'OK: INSERT respins pentru plan free (check_violation)';
              when others then
                if sqlerrm like '%plan_upgrade_required%' or sqlerrm like '%Growth%' or sqlerrm like '%free%' then
                  v_blocked := true;
                  raise notice 'OK: INSERT respins pentru plan free: %', sqlerrm;
                else
                  raise exception 'ASSERTION FAILED unexpected error: %', sqlerrm;
                end if;
            end;

            if not v_blocked then
              raise exception 'ASSERTION FAILED: Plan free a putut crea o comandă!';
            end if;

            -- Test pentru 'starter' — același comportament
            update public.profiles set plan = 'starter' where id = v_owner_id;
            v_blocked := false;
            begin
              insert into public.orders (
                restaurant_id, table_id, source, status, total
              ) values (
                v_rest_id, v_table_id, 'qr', 'new', 0
              );
              raise exception 'ASSERTION FAILED: Plan 1 (starter) a putut crea o comandă!';
            exception
              when others then
                v_blocked := true;
                raise notice 'OK: INSERT respins pentru plan starter: %', sqlerrm;
            end;

            if not v_blocked then
              raise exception 'ASSERTION FAILED: Plan starter a putut crea o comandă!';
            end if;

            -- Test pozitiv: growth TREBUIE să poată insera
            update public.profiles set plan = 'growth' where id = v_owner_id;
            begin
              insert into public.orders (
                restaurant_id, table_id, source, status, total
              ) values (
                v_rest_id, v_table_id, 'qr', 'new', 0
              );
              raise notice 'OK: Plan growth poate crea comenzi.';
            exception
              when others then
                raise exception 'ASSERTION FAILED: Plan growth NU a putut crea o comandă: %', sqlerrm;
            end;

            -- Test per-source: mig 083 gate-uiește și 'pickup' (pickup_orders) și
            -- 'waiter' (waiter_manual), nu doar 'qr'. Verificăm pickup pe free —
            -- altfel o spargere a mapării source→feature ar trece neobservată.
            update public.profiles set plan = 'free' where id = v_owner_id;
            v_blocked := false;
            begin
              insert into public.orders (restaurant_id, table_id, source, status, total)
                values (v_rest_id, v_table_id, 'pickup', 'new', 0);
              raise exception 'ASSERTION FAILED: Plan free a putut crea comandă pickup!';
            exception
              when others then
                if sqlerrm like '%plan%' or sqlerrm like '%Growth%' or sqlerrm like '%disponibile%' then
                  v_blocked := true;
                  raise notice 'OK: pickup respins pe plan free: %', sqlerrm;
                else
                  raise exception 'ASSERTION FAILED unexpected error la pickup/free: %', sqlerrm;
                end if;
            end;
            if not v_blocked then
              raise exception 'ASSERTION FAILED: pickup nu e gate-uit pe free!';
            end if;

            raise notice '✅ Gate A assertions passed: free/starter blocked (qr+pickup), growth allowed.';
          end$$;
          ASSERTION

      - name: "Gate B assertion: session closed → rejects new QR orders"
        env:
          PGPASSWORD: postgres
        run: |
          # Spec §4 Poarta B: "Test de asserțiune: sesiune închisă respinge comenzi QR"
          # Verificăm că create_order cu p_session_id closed returnează eroare
          # și că open_table_session returnează sesiune validă.
          psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 <<'ASSERTION'
          do $$
          declare
            v_owner_id    uuid := gen_random_uuid();
            v_rest_id     uuid := gen_random_uuid();
            v_table_id    uuid := gen_random_uuid();
            v_token_id    uuid := gen_random_uuid();
            v_token       text := 'test-gate-b-token-' || extract(epoch from now())::bigint;
            v_session     jsonb;
            v_session_id  uuid;
            v_closed_sess uuid := gen_random_uuid();
            v_blocked     boolean := false;
          begin
            -- Setup: user cu plan 'growth' (poate crea comenzi)
            -- Trigger handle_new_user creează profilul; setăm planul prin update.
            insert into auth.users (id, email) values (v_owner_id, 'test-gate-b@menuvia.ro');
            update public.profiles set plan = 'growth' where id = v_owner_id;

            insert into public.restaurants (id, owner_id, name, slug, city, is_active)
              values (v_rest_id, v_owner_id, 'Test Restaurant Gate B', 'test-gate-b-slug', 'București', true);

            insert into public.tables (id, restaurant_id, name, slug, is_active, seats)
              values (v_table_id, v_rest_id, 'Masa 1', 'masa-1', true, 4);

            -- Token QR valid
            insert into public.qr_tokens (id, restaurant_id, table_id, token, is_active)
              values (v_token_id, v_rest_id, v_table_id, v_token, true);

            -- Setăm context anon (cum face clientul real)
            perform set_config('request.jwt.claim.role', 'anon', true);

            -- Test 1: open_table_session creează sesiune nouă
            v_session := public.open_table_session(v_token);
            if v_session->>'status' != 'open' then
              raise exception 'ASSERTION FAILED: open_table_session nu a creat sesiune open: %', v_session;
            end if;
            if (v_session->>'is_new')::boolean != true then
              raise exception 'ASSERTION FAILED: sesiunea ar trebui să fie nouă: %', v_session;
            end if;
            v_session_id := (v_session->>'session_id')::uuid;
            raise notice 'OK: open_table_session a creat sesiunea % pentru masa %', v_session_id, v_table_id;

            -- Test 2: open_table_session e idempotentă (returnează aceeași sesiune)
            v_session := public.open_table_session(v_token);
            if (v_session->>'session_id')::uuid != v_session_id then
              raise exception 'ASSERTION FAILED: open_table_session nu e idempotentă — sesiune diferită returnată';
            end if;
            if (v_session->>'is_new')::boolean != false then
              raise exception 'ASSERTION FAILED: a doua scanare ar trebui is_new=false';
            end if;
            raise notice 'OK: open_table_session este idempotentă';

            -- Test 2.5: CONTROL POZITIV — sesiunea OPEN trece de session-guard.
            -- Folosim un product_id fals: dacă guard-ul de sesiune ar respinge
            -- și sesiunile open (logică inversată), eroarea ar fi cea de sesiune;
            -- cu guard corect, create_order ajunge la validarea produselor și
            -- eșuează cu 'Product not found' — dovadă că open a trecut de guard.
            begin
              perform public.create_order(
                v_rest_id, 'qr', v_table_id, v_token_id, null,
                '[{"product_id":"00000000-0000-0000-0000-000000000001","quantity":1}]'::jsonb,
                null, null, null, null,
                v_session_id  -- sesiunea OPEN din Test 1
              );
              raise exception 'ASSERTION FAILED: create_order a trecut complet cu produs fals!';
            exception
              when others then
                if sqlerrm like '%Product not found%' then
                  raise notice 'OK: sesiunea OPEN trece de session-guard (eșec doar la produs)';
                elsif sqlerrm like '%închis%' or sqlerrm like '%sesiune%' or sqlerrm like '%expirat%' then
                  raise exception 'ASSERTION FAILED: session-guard respinge și sesiuni OPEN: %', sqlerrm;
                else
                  raise exception 'ASSERTION FAILED: eroare neașteptată la control pozitiv: %', sqlerrm;
                end if;
            end;

            -- Test 3: sesiune closed → create_order cu p_session_id respinge comanda
            -- Inserăm manual o sesiune CLOSED (simulează masa plătită)
            -- Sesiune CLOSED pe ACEEAȘI masă (v_table_id) ca să declanșeze
            -- exact guard-ul session_closed din create_order (table_id trebuie
            -- să existe — FK către tables — și să corespundă token-ului).
            insert into public.table_sessions (id, restaurant_id, table_id, status, closed_at)
              values (v_closed_sess, v_rest_id, v_table_id, 'closed', now());

            v_blocked := false;
            begin
              perform public.create_order(
                v_rest_id,   -- p_restaurant_id
                'qr',        -- p_source
                v_table_id,  -- p_table_id
                v_token_id,  -- p_qr_token_id
                null,        -- p_notes
                '[{"product_id":"00000000-0000-0000-0000-000000000001","quantity":1}]'::jsonb,
                null,        -- p_idempotency_key
                null,        -- p_pickup_time
                null,        -- p_customer_name
                null,        -- p_customer_phone
                v_closed_sess -- p_session_id (sesiune CLOSED — trebuie respinsă)
              );
              raise exception 'ASSERTION FAILED: create_order a acceptat sesiune closed!';
            exception
              when others then
                -- SQLERRM = textul mesajului ('Masa a fost închisă...'), nu hint-ul.
                -- Acceptăm DOAR mesajul guard-ului de sesiune; orice altă eroare
                -- (ex: product not found) înseamnă că guard-ul NU s-a activat → fail.
                if sqlerrm like '%închis%' or sqlerrm like '%sesiune%' or sqlerrm like '%expirat%' then
                  v_blocked := true;
                  raise notice 'OK: create_order respinge sesiune closed: %', sqlerrm;
                else
                  raise exception 'ASSERTION FAILED: expected session_closed guard, got: %', sqlerrm;
                end if;
            end;

            if not v_blocked then
              raise exception 'ASSERTION FAILED: create_order a acceptat sesiune closed!';
            end if;

            raise notice '✅ Gate B assertions passed: open_table_session OK + idempotent, closed session rejected.';
          end$$;
          ASSERTION

      - name: "Gate B+ assertion: create_order FULL happy path (real product)"
        env:
          PGPASSWORD: postgres
        run: |
          # Regresie-guard sistemic: TOATE asserțiunile anterioare foloseau un
          # product_id fals → create_order eșua la validarea produsului ÎNAINTE
          # de a atinge INSERT-ul real. Asta a ascuns 5 bug-uri în mig 084
          # (ordine INSERT/FK, coloană extras, happy hour, pickup) reparate în 088.
          # Aici cream o comandă COMPLETĂ cu produs real → INSERT-ul chiar rulează.
          psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 <<'ASSERTION'
          do $$
          declare
            v_owner uuid := gen_random_uuid();
            v_rest  uuid := gen_random_uuid();
            v_table uuid := gen_random_uuid();
            v_tok   uuid := gen_random_uuid();
            v_token text := 'gate-bplus-' || extract(epoch from now())::bigint;
            v_pid   uuid;
            v_sess  jsonb; v_sid uuid; v_res jsonb; v_oid uuid;
            v_total numeric; v_items int; v_blocked boolean := false;
          begin
            insert into auth.users (id, email) values (v_owner, 'gate-bplus@menuvia.ro');
            update public.profiles set plan = 'growth' where id = v_owner;
            insert into public.restaurants (id, owner_id, name, slug, city, is_active)
              values (v_rest, v_owner, 'Gate B+ R', 'gate-bplus-slug', 'Cluj', true);
            insert into public.tables (id, restaurant_id, name, slug, is_active, seats)
              values (v_table, v_rest, 'Masa 1', 'masa-bplus', true, 4);
            insert into public.qr_tokens (id, restaurant_id, table_id, token, is_active)
              values (v_tok, v_rest, v_table, v_token, true);
            insert into public.products (restaurant_id, category_id, name, price, is_active)
              values (v_rest, null, 'Cafea', 12.00, true) returning id into v_pid;

            perform set_config('request.jwt.claim.role', 'anon', true);

            -- 1: qr FĂRĂ sesiune → respins (mig 088 strict)
            begin
              perform public.create_order(v_rest, 'qr', v_table, v_tok, null,
                ('[{"product_id":"' || v_pid || '","quantity":1}]')::jsonb,
                null, null, null, null, null);
              raise exception 'ASSERTION FAILED: qr fără sesiune acceptat!';
            exception when others then
              if sqlerrm like '%Sesiunea mesei lipsește%' then
                v_blocked := true;
                raise notice 'OK: qr fără session_id respins (session_required)';
              else
                raise exception 'ASSERTION FAILED: eroare neașteptată: %', sqlerrm;
              end if;
            end;
            if not v_blocked then raise exception 'ASSERTION FAILED: guard sesiune absent'; end if;

            -- 2: qr CU sesiune open + produs real → comandă COMPLETĂ
            v_sess := public.open_table_session(v_token);
            v_sid  := (v_sess->>'session_id')::uuid;
            v_res  := public.create_order(v_rest, 'qr', v_table, v_tok, null,
              ('[{"product_id":"' || v_pid || '","quantity":3}]')::jsonb,
              null, null, null, null, v_sid);
            v_oid := (v_res->>'id')::uuid;

            select total into v_total from public.orders where id = v_oid;
            if v_total is distinct from 36.00 then
              raise exception 'ASSERTION FAILED: total ar trebui 36.00, e: %', v_total;
            end if;
            select count(*) into v_items from public.order_items where order_id = v_oid;
            if v_items != 1 then
              raise exception 'ASSERTION FAILED: ar trebui 1 order_item, sunt: %', v_items;
            end if;
            raise notice 'OK: comanda QR completă — orders + order_items inserate, total=%', v_total;

            raise notice '✅ Gate B+ passed: create_order full path funcționează (FK + extras_added + happy-hour trigger + sesiune).';
          end$$;
          ASSERTION

      - name: "Tracking assertion: session-bound public status (mig 092)"
        env:
          PGPASSWORD: postgres
        run: |
          # Audit securitate: tracking-ul public cere sesiune validă pentru
          # payload complet; fără sesiune → doar {id, short_id, status}.
          # request_fiscal_receipt (WRITE) refuză fără sesiune validă.
          psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 <<'ASSERTION'
          do $$
          declare
            v_owner_id   uuid := gen_random_uuid();
            v_rest_id    uuid := gen_random_uuid();
            v_table_id   uuid := gen_random_uuid();
            v_session_id uuid := gen_random_uuid();
            v_order_id   uuid := gen_random_uuid();
            v_pickup_id  uuid := gen_random_uuid();
            v_res        jsonb;
            v_blocked    boolean := false;
          begin
            insert into auth.users (id, email) values (v_owner_id, 'test-tracking@menuvia.ro');
            update public.profiles set plan = 'growth' where id = v_owner_id;
            insert into public.restaurants (id, owner_id, name, slug, city, is_active)
              values (v_rest_id, v_owner_id, 'Test Tracking', 'test-tracking-slug', 'Cluj', true);
            insert into public.tables (id, restaurant_id, name, slug, is_active)
              values (v_table_id, v_rest_id, 'Masa 1', 'masa-1', true);
            insert into public.table_sessions (id, restaurant_id, table_id, status)
              values (v_session_id, v_rest_id, v_table_id, 'open');
            insert into public.orders (id, restaurant_id, table_id, source, status, total, session_id)
              values (v_order_id, v_rest_id, v_table_id, 'qr', 'served', 45.00, v_session_id);

            -- T1: doar UUID → payload MINIM (fără total/payment_method)
            v_res := public.get_order_public_status(v_order_id, null);
            if v_res ? 'total' or v_res ? 'payment_method' then
              raise exception 'ASSERTION FAILED: payload fără sesiune conține bani: %', v_res;
            end if;
            if (v_res->>'status') is distinct from 'served' then
              raise exception 'ASSERTION FAILED: payload minim trebuie să conțină statusul: %', v_res;
            end if;
            raise notice 'OK: UUID singur → payload minim (status + short_id)';

            -- T2: UUID + sesiune validă → payload COMPLET
            v_res := public.get_order_public_status(v_order_id, v_session_id);
            if not (v_res ? 'total') or (v_res->>'total')::numeric is distinct from 45.00 then
              raise exception 'ASSERTION FAILED: payload cu sesiune ar trebui complet: %', v_res;
            end if;
            raise notice 'OK: UUID + sesiune validă → payload complet (total=45.00)';

            -- T3: request_fiscal_receipt fără sesiune → REFUZ
            begin
              perform public.request_fiscal_receipt(v_order_id, null);
              raise exception 'ASSERTION FAILED: fiscal receipt acceptat fără sesiune!';
            exception when others then
              if sqlerrm like '%Sesiunea mesei nu mai este valid%' then
                v_blocked := true;
                raise notice 'OK: fiscal receipt fără sesiune respins (session_required)';
              else
                raise exception 'ASSERTION FAILED: eroare neașteptată la T3: %', sqlerrm;
              end if;
            end;
            if not v_blocked then raise exception 'ASSERTION FAILED: gate sesiune absent pe fiscal receipt'; end if;

            -- T4: request_fiscal_receipt CU sesiune validă → succes (status served)
            v_res := public.request_fiscal_receipt(v_order_id, v_session_id);
            if not (v_res->>'success')::boolean then
              raise exception 'ASSERTION FAILED: fiscal receipt cu sesiune validă a eșuat: %', v_res;
            end if;
            raise notice 'OK: fiscal receipt cu sesiune validă funcționează';

            -- T5: comandă FĂRĂ sesiune (pickup/legacy) → full payload pe UUID (compatibilitate)
            insert into public.orders (id, restaurant_id, source, status, total)
              values (v_pickup_id, v_rest_id, 'pickup', 'served', 30.00);
            v_res := public.get_order_public_status(v_pickup_id, null);
            if not (v_res ? 'total') then
              raise exception 'ASSERTION FAILED: pickup fără sesiune ar trebui full payload: %', v_res;
            end if;
            raise notice 'OK: pickup (fără session_id) păstrează comportamentul vechi';

            raise notice '✅ Tracking assertion passed: payload complet doar cu sesiune validă (mig 092).';
          end$$;
          ASSERTION

      - name: "Critical fixes assertion (mig 094): 5 P0 vulnerabilities closed"
        env:
          PGPASSWORD: postgres
        run: |
          # Audit critic 2026-06-14: 5 vulnerabilități critice închise în mig 094.
          psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 <<'ASSERTION'
          do $$
          declare
            v_owner_id   uuid := gen_random_uuid();
            v_rest_id    uuid := gen_random_uuid();
            v_table_id   uuid := gen_random_uuid();
            v_order_id   uuid := gen_random_uuid();
            v_session_id uuid := gen_random_uuid();
            v_blocked    boolean;
            v_count      int;
            v_status     text;
          begin
            insert into auth.users (id, email) values (v_owner_id, 'test-mig094@menuvia.ro');
            update public.profiles set plan = 'starter' where id = v_owner_id;
            insert into public.restaurants (id, owner_id, name, slug, city, is_active)
              values (v_rest_id, v_owner_id, 'Test Mig 094', 'test-mig094', 'Cluj', true);
            insert into public.tables (id, restaurant_id, name, slug, is_active)
              values (v_table_id, v_rest_id, 'Masa 1', 'masa-1', true);

            -- T1 (Fix 1): create_order 10-arg NU mai există
            select count(*) into v_count
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and p.proname = 'create_order'
               and pg_get_function_identity_arguments(p.oid) =
                   'p_restaurant_id uuid, p_source text, p_table_id uuid, p_qr_token_id uuid, p_notes text, p_items jsonb, p_idempotency_key uuid, p_pickup_time timestamp with time zone, p_customer_name text, p_customer_phone text';
            if v_count > 0 then
              raise exception 'ASSERTION FAILED T1: create_order 10-arg încă există (bypass mig 088)';
            end if;
            raise notice 'OK T1: create_order 10-arg DROP-uit';

            -- T2 (Fix 2): is_admin/is_member/my_role au search_path setat
            select count(*) into v_count
              from pg_proc p
             where p.proname in ('is_admin', 'is_member', 'my_role')
               and array_to_string(p.proconfig, ',') like '%search_path=%';
            if v_count != 3 then
              raise exception 'ASSERTION FAILED T2: doar % din 3 funcții RLS au search_path', v_count;
            end if;
            raise notice 'OK T2: backbone RLS cu search_path setat';

            -- T3 (Fix 3): feature fiscal_receipt pe toate planurile
            select count(*) into v_count from public.plan_features where feature = 'fiscal_receipt';
            if v_count < 5 then
              raise exception 'ASSERTION FAILED T3: fiscal_receipt seed incomplet (%)', v_count;
            end if;
            raise notice 'OK T3: fiscal_receipt seed pe toate planurile';

            -- Setup pentru T4-T8: creem comanda pe plan growth (care permite QR),
            -- apoi schimbăm planul ca să testăm gate-ul fiscal pe mark_paid.
            update public.profiles set plan = 'growth' where id = v_owner_id;
            insert into public.table_sessions (id, restaurant_id, table_id, status)
              values (v_session_id, v_rest_id, v_table_id, 'open');
            insert into public.orders (id, restaurant_id, table_id, source, status, total, session_id)
              values (v_order_id, v_rest_id, v_table_id, 'qr', 'served', 100.00, v_session_id);

            perform set_config('request.jwt.claim.sub', v_owner_id::text, true);
            perform set_config('request.jwt.claim.role', 'authenticated', true);

            -- T4 (Fix 4a): growth (fără fiscal_receipt) NU poate mark_paid
            v_blocked := false;
            begin
              perform public.advance_order(v_order_id, 'mark_paid', 100.00, 'cash', null, null);
              raise exception 'ASSERTION FAILED T4: growth a putut emite bon fiscal!';
            exception when others then
              if sqlerrm like '%nu e disponibil%' or sqlerrm like '%feature_disabled%' then
                v_blocked := true;
                raise notice 'OK T4: growth blocat la mark_paid (regula de aur)';
              else
                raise exception 'ASSERTION FAILED T4: eroare neașteptată: %', sqlerrm;
              end if;
            end;
            if not v_blocked then raise exception 'ASSERTION FAILED T4: gate fiscal absent'; end if;

            -- T5 (control pozitiv): pro POATE mark_paid
            update public.profiles set plan = 'pro' where id = v_owner_id;
            perform public.advance_order(v_order_id, 'mark_paid', 100.00, 'cash', null, null);
            select status into v_status from public.orders where id = v_order_id;
            if v_status != 'paid' then
              raise exception 'ASSERTION FAILED T5: pro nu a putut mark_paid (status: %)', v_status;
            end if;
            raise notice 'OK T5 (CONTROL POZITIV): pro → status=paid';

            -- T6 (Fix 4b): paid_amount negativ respins (rămânem pe pro pentru ordering)
            insert into public.orders (id, restaurant_id, table_id, source, status, total)
              values (gen_random_uuid(), v_rest_id, v_table_id, 'qr', 'served', 50.00)
              returning id into v_order_id;
            v_blocked := false;
            begin
              perform public.advance_order(v_order_id, 'mark_paid', -50.00, 'cash', null, null);
              raise exception 'ASSERTION FAILED T6: paid_amount negativ acceptat!';
            exception when others then
              if sqlerrm like '%nu poate fi negativ%' or sqlerrm like '%invalid_amount%' then
                v_blocked := true;
                raise notice 'OK T6: paid_amount negativ respins';
              else
                raise exception 'ASSERTION FAILED T6: eroare neașteptată: %', sqlerrm;
              end if;
            end;
            if not v_blocked then raise exception 'ASSERTION FAILED T6: validare semn absentă'; end if;

            -- T7 (Fix 5): submit_order_feedback fără p_session_id respins
            insert into public.orders (id, restaurant_id, table_id, source, status, total, session_id)
              values (gen_random_uuid(), v_rest_id, v_table_id, 'qr', 'served', 25.00, v_session_id)
              returning id into v_order_id;
            v_blocked := false;
            begin
              perform public.submit_order_feedback(v_order_id, 'service', 5, null, null);
              raise exception 'ASSERTION FAILED T7: feedback acceptat fără session_id!';
            exception when others then
              if sqlerrm like '%session_required%' or sqlerrm like '%nu mai este valid%' then
                v_blocked := true;
                raise notice 'OK T7: feedback fără sesiune respins';
              else
                raise exception 'ASSERTION FAILED T7: eroare neașteptată: %', sqlerrm;
              end if;
            end;
            if not v_blocked then raise exception 'ASSERTION FAILED T7: session-gate feedback absent'; end if;

            -- T8 (control pozitiv): feedback cu sesiune validă acceptat
            perform public.submit_order_feedback(v_order_id, 'service', 5, 'test', v_session_id);
            raise notice 'OK T8 (CONTROL POZITIV): feedback cu sesiune acceptat';

            raise notice '✅ Mig 094 assertion passed: 5 vulnerabilități P0 închise.';
          end$$;
          ASSERTION

      - name: "Gate C assertion: lifecycle closed + close_session_orders"
        env:
          PGPASSWORD: postgres
        run: |
          # Spec §5 Poarta C: tranziție served→closed și close_session_orders
          psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 <<'ASSERTION'
          do $$
          declare
            v_owner_id    uuid := gen_random_uuid();
            v_rest_id     uuid := gen_random_uuid();
            v_table_id    uuid := gen_random_uuid();
            v_session_id  uuid;
            v_order_id    uuid;
            v_result      jsonb;
            v_status      text;
          begin
            -- Setup: user cu plan 'growth'
            -- Trigger handle_new_user creează profilul; setăm planul prin update.
            insert into auth.users (id, email) values (v_owner_id, 'test-gate-c@menuvia.ro');
            update public.profiles set plan = 'growth' where id = v_owner_id;

            insert into public.restaurants (id, owner_id, name, slug, city, is_active)
              values (v_rest_id, v_owner_id, 'Test Gate C Restaurant', 'test-gate-c-slug', 'Cluj', true);

            -- Owner membership creat automat de trigger bootstrap_restaurant_owner.

            insert into public.tables (id, restaurant_id, name, slug, is_active)
              values (v_table_id, v_rest_id, 'Masa 1', 'masa-1', true);

            -- Creem o sesiune open
            v_session_id := gen_random_uuid();
            insert into public.table_sessions (id, restaurant_id, table_id, status)
              values (v_session_id, v_rest_id, v_table_id, 'open');

            -- Creem o comandă în sesiune (status 'served')
            v_order_id := gen_random_uuid();
            insert into public.orders (id, restaurant_id, table_id, source, status, total, session_id)
              values (
                v_order_id,
                v_rest_id, v_table_id, 'qr', 'served', 45.00, v_session_id
              );

            -- Setăm context ca owner (pentru advance_order auth check)
            perform set_config('request.jwt.claim.sub', v_owner_id::text, true);
            perform set_config('request.jwt.claim.role', 'authenticated', true);

            -- Test 1: advance_order cu action='close_order' → served → closed
            v_result := public.advance_order(v_order_id, 'close_order', null, null);
            if not (v_result->>'ok')::boolean then
              raise exception 'ASSERTION FAILED: advance_order close_order a eșuat: %', v_result;
            end if;

            select status into v_status from public.orders where id = v_order_id;
            if v_status != 'closed' then
              raise exception 'ASSERTION FAILED: orders.status ar trebui să fie closed, e: %', v_status;
            end if;
            raise notice 'OK: advance_order served→closed funcționează';

            -- Sesiunea trebuie să se fi închis automat (trigger maybe_close_session_fn)
            select status into v_status from public.table_sessions where id = v_session_id;
            if v_status != 'closed' then
              raise exception 'ASSERTION FAILED: table_sessions.status ar trebui să fie closed (trigger), e: %', v_status;
            end if;
            raise notice 'OK: auto-close sesiune funcționează după última comandă closed';

            -- Test 2: close_session_orders pe sesiune deja closed → ok, already_closed=true
            v_result := public.close_session_orders(v_session_id);
            if not (v_result->>'already_closed')::boolean then
              raise exception 'ASSERTION FAILED: close_session_orders pe sesiune deja closed ar trebui already_closed=true: %', v_result;
            end if;
            raise notice 'OK: close_session_orders idempotent pe sesiune deja closed';

            -- Test 3: enum order_status conține 'closed'
            -- Verificare indirectă: dacă insert cu status='closed' funcționează, enum e corect
            begin
              insert into public.orders (restaurant_id, table_id, source, status, total)
                values (v_rest_id, v_table_id, 'qr', 'closed', 0);
              raise notice 'OK: enum order_status conține closed';
            exception
              when invalid_text_representation then
                raise exception 'ASSERTION FAILED: enum order_status nu conține closed!';
              when others then
                -- Alte erori (trigger plan-gate etc.) înseamnă că enum e OK
                raise notice 'OK: enum closed există (eroare la trigger, nu la enum): %', sqlerrm;
            end;

            -- Test 4: REGRESIE tips — mark_paid cu p_tips_amount scrie orders.tips_amount.
            -- Semnătura advance_order a pierdut odată p_tips_amount (rescriere Gate C)
            -- și bacșișurile ospătarilor se evaporau silențios. Acest test blochează re-regresia.
            -- NB: mig 094 a gate-uit mark_paid pe fiscal_receipt (regula de aur — bani + bon = Plan 3).
            -- Upgrade la 'pro' ca să trecem prin enforce_feature_for_restaurant.
            update public.profiles set plan = 'pro' where id = v_owner_id;
            v_order_id := gen_random_uuid();
            insert into public.orders (id, restaurant_id, table_id, source, status, total, session_id)
              values (v_order_id, v_rest_id, v_table_id, 'qr', 'served', 60.00, null);
            -- Contractul PayModal (mig 214/262): p_paid_amount e suma ÎNMÂNATĂ,
            -- adică nota + bacșiș (65.50 = 60.00 + 5.50). Vechiul apel trimitea
            -- 60.00 cu bacșiș 5.50, ceea ce sub contractul de azi înseamnă doar
            -- 54.50 pe notă — sub-încasare, respinsă de pragul din mig 264.
            v_result := public.advance_order(v_order_id, 'mark_paid', 65.50, 'cash', 5.50, null);
            select tips_amount::text into v_status from public.orders where id = v_order_id;
            if v_status is distinct from '5.50' then
              raise exception 'ASSERTION FAILED: tips_amount ar trebui 5.50, e: %', v_status;
            end if;
            -- Bacșișul NU intră în paid_amount (mig 262): nota rămâne 60.00.
            select paid_amount::text into v_status from public.orders where id = v_order_id;
            if v_status is distinct from '60.00' then
              raise exception 'ASSERTION FAILED: paid_amount ar trebui 60.00 (fără bacșiș), e: %', v_status;
            end if;
            raise notice 'OK: mark_paid scrie tips_amount separat de paid_amount — regresia tips e blocată';

            -- Test 5: REGRESIE cancel_reason — cancel cu p_cancel_reason persistă motivul.
            v_order_id := gen_random_uuid();
            insert into public.orders (id, restaurant_id, table_id, source, status, total, session_id)
              values (v_order_id, v_rest_id, v_table_id, 'qr', 'new', 10.00, null);
            v_result := public.advance_order(v_order_id, 'cancel', null, null, null, 'test-motiv-anulare');
            select cancel_reason into v_status from public.orders where id = v_order_id;
            if v_status is distinct from 'test-motiv-anulare' then
              raise exception 'ASSERTION FAILED: cancel_reason ar trebui persistat, e: %', v_status;
            end if;
            raise notice 'OK: cancel scrie cancel_reason — audit trail intact';

            raise notice '✅ Gate C assertions passed: closed lifecycle + auto-close session + tips/cancel_reason.';
          end$$;
          ASSERTION

      - name: "Gate D assertion: module toggle + reservations gating"
        env:
          PGPASSWORD: postgres
        run: |
          # Spec §6 Poarta D: modulele opționale sunt OFF default și blocate
          # server-side. Test: încercăm rezervare fără module → eroare;
          # activăm modulul → permise.
          psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 <<'ASSERTION'
          do $$
          declare
            v_owner_id    uuid := gen_random_uuid();
            v_rest_id     uuid := gen_random_uuid();
            v_table_id    uuid := gen_random_uuid();
            v_module_enabled boolean;
            v_caught      boolean := false;
          begin
            -- Setup: owner + restaurant + masă
            -- Trigger handle_new_user creează profilul; setăm planul prin update.
            insert into auth.users (id, email) values (v_owner_id, 'test-gate-d@menuvia.ro');
            update public.profiles set plan = 'growth' where id = v_owner_id;
            insert into public.restaurants (id, owner_id, name, slug, city, is_active)
              values (v_rest_id, v_owner_id, 'Test Gate D Restaurant', 'test-gate-d-slug', 'Iași', true);
            -- Owner membership creat automat de trigger bootstrap_restaurant_owner.
            insert into public.tables (id, restaurant_id, name, slug, seats, is_active)
              values (v_table_id, v_rest_id, 'Masa GD1', 'masa-gd1', 4, true);

            -- Test 1: is_module_enabled returnează false când rândul lipsește
            v_module_enabled := public.is_module_enabled(v_rest_id, 'reservations');
            if v_module_enabled then
              raise exception 'ASSERTION FAILED: is_module_enabled trebuie să fie false pentru modul inexistent';
            end if;
            raise notice 'OK: is_module_enabled returnează false (default OFF)';

            -- Test 2: create_reservation_public eșuează cu module OFF
            begin
              perform * from public.create_reservation_public(
                'test-gate-d-slug', 'Ion Test', '0700111222',
                2::smallint, now() + interval '24 hours',
                null, null, null, null
              );
              raise exception 'ASSERTION FAILED: create_reservation_public ar fi trebuit să eșueze (modul OFF)';
            exception
              when others then
                if sqlerrm ilike '%nu sunt activate%' or sqlerrm ilike '%module_disabled%' then
                  v_caught := true;
                  raise notice 'OK: create_reservation_public respins corect (modul OFF): %', sqlerrm;
                else
                  raise exception 'ASSERTION FAILED: expected module_disabled for OFF module, got: %', sqlerrm;
                end if;
            end;
            if not v_caught then
              raise exception 'ASSERTION FAILED: nu am prins niciun raise pentru module OFF';
            end if;

            -- Test 3: activăm modulul (direct insert ca să nu depindem de auth.uid)
            insert into public.restaurant_modules (restaurant_id, module_key, enabled, configured_by)
              values (v_rest_id, 'reservations', true, v_owner_id);

            v_module_enabled := public.is_module_enabled(v_rest_id, 'reservations');
            if not v_module_enabled then
              raise exception 'ASSERTION FAILED: is_module_enabled trebuie să fie true după insert';
            end if;
            raise notice 'OK: is_module_enabled returnează true după activare';

            -- Test 4: create_reservation_public funcționează acum
            -- (poate eșua din alte motive — settings, etc — dar NU module gate)
            begin
              perform * from public.create_reservation_public(
                'test-gate-d-slug', 'Ion Test', '0700111222',
                2::smallint, now() + interval '24 hours',
                null, null, null, null
              );
              raise notice 'OK: create_reservation_public a trecut cu modul ON';
            exception
              when others then
                if sqlerrm ilike '%nu sunt activate%' or sqlerrm ilike '%module_disabled%' then
                  raise exception 'ASSERTION FAILED: module gate respinge chiar și cu modul ON: %', sqlerrm;
                end if;
                raise notice 'OK: create_reservation_public a trecut de module gate (eroare ulterioară: %)', sqlerrm;
            end;

            -- Test 5: dezactivăm modulul prin update direct
            update public.restaurant_modules
              set enabled = false
              where restaurant_id = v_rest_id and module_key = 'reservations';

            v_module_enabled := public.is_module_enabled(v_rest_id, 'reservations');
            if v_module_enabled then
              raise exception 'ASSERTION FAILED: is_module_enabled trebuie să fie false după update';
            end if;
            raise notice 'OK: toggle off persistă';

            raise notice '✅ Gate D assertions passed: module toggle blochează server-side.';
          end$$;
          ASSERTION

      - name: "Gate C enforcement: table_lifecycle plan-gate on close_order"
        env:
          PGPASSWORD: postgres
        run: |
          # Spec §10 Poarta C exit: free/starter NU pot folosi close_order
          # (lifecycle non-fiscal e feature Plan 2+).
          psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 <<'ASSERTION'
          do $$
          declare
            v_owner_id   uuid := gen_random_uuid();
            v_rest_id    uuid := gen_random_uuid();
            v_table_id   uuid := gen_random_uuid();
            v_session_id uuid := gen_random_uuid();
