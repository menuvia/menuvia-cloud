        if: ${{ hashFiles('supabase/tests/build_fiscalnet_payload_test.sql') != '' }}
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/build_fiscalnet_payload_test.sql

      - name: "Authorization PR 1A: load CI-only audit helper"
        if: ${{ hashFiles('supabase/migrations/20260615000000_migration_096a_authorization_foundation.sql') != '' }}
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 \
            -f tests/sql/helpers/assert_security_audit_shape.sql

      - name: "Authorization PR 1A: catalog drift harness (18 cases)"
        if: ${{ hashFiles('supabase/migrations/20260615000000_migration_096a_authorization_foundation.sql') != '' }}
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/sql/catalog_drift/*.sql)
          if (( ${#files[@]} != 18 )); then
            echo "DRIFT FAIL: expected exactly 18 drift cases, found ${#files[@]}"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "── drift case: $f"
            psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: "Authorization PR 1A: drop CI-only audit helper"
        if: ${{ always() && hashFiles('supabase/migrations/20260615000000_migration_096a_authorization_foundation.sql') != '' }}
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d menuvia_test -v ON_ERROR_STOP=1 -c \
            "drop function if exists public.assert_security_audit_shape(text);"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-logs
          path: /tmp/*.log
          retention-days: 7
