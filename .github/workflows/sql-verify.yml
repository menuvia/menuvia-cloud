name: SQL Migrations Verify

# Rulează la fiecare PR ce atinge migrații. Aplică toate migrațiile pe PostgreSQL
# temporar pentru a prinde bug-uri sintactice + dependențe înainte de a ajunge
# pe Supabase real. Asta ar fi prins, de exemplu:
#   - migration-025 cu pickup în CHECK constraint dar fără ALTER TYPE
#   - migration-046 v1 cu SELECT short_id din coloană inexistentă

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/**.sql'
      - '.github/workflows/sql-verify.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/**.sql'
      - '.github/workflows/sql-verify.yml'

jobs:
  verify:
    name: Apply all migrations to ephemeral Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menuvia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres ready
        env:
          PGPASSWORD: postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres ready after $i attempts"
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Create Supabase-compatible extensions and roles
        env:
          PGPASSWORD: postgres
        run: |
          # Migrațiile noastre presupun anumite extensii și roluri Supabase.
          # Le creem aici ca să nu eșueze GRANT-urile și extension-urile.
          psql -h localhost -U postgres -d menuvia_test <<EOF
          -- Extensions standard Supabase
          create extension if not exists "uuid-ossp";
          create extension if not exists "pgcrypto";

          -- Roles Supabase standard
          do \$\$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role noinherit bypassrls;
            end if;
          end \$\$;

          -- Mock auth schema (Supabase îl oferă, aici îl simulăm minimal)
          create schema if not exists auth;

          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            created_at timestamptz default now()
          );

          -- Mock auth.uid() — în Supabase real e legat de JWT
          create or replace function auth.uid() returns uuid
            language sql stable as \$\$
              select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
            \$\$;

          -- Mock auth.role()
          create or replace function auth.role() returns text
            language sql stable as \$\$
              select coalesce(current_setting('request.jwt.claim.role', true), 'anon')
            \$\$;
          EOF

      - name: Apply all migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          cd supabase/migrations

          # Ordonez migrațiile lexicografic — formatul timestamp_migration_NNN_*.sql
          # este safe la sort simplu (prefix YYYYMMDDHHMMSS).
          MIGRATIONS=$(ls *.sql 2>/dev/null | sort)

          if [ -z "$MIGRATIONS" ]; then
            echo "No migrations found in supabase/migrations/!"
            exit 1
          fi

          echo "Found $(echo "$MIGRATIONS" | wc -l) migrations"
          echo ""

          FAILED=0
          for mig in $MIGRATIONS; do
            echo "─────────────────────────────────────────"
            echo "Applying: $mig"
            echo "─────────────────────────────────────────"

            if psql -h localhost -U postgres -d menuvia_test \
                    -v ON_ERROR_STOP=1 \
                    -f "$mig" 2>&1 | tee "/tmp/$mig.log"; then
              echo "✓ $mig OK"
            else
              echo "✗ $mig FAILED"
              FAILED=1
              # Don't continue past first failure — migrations are ordered
              break
            fi
            echo ""
          done

          if [ "$FAILED" = "1" ]; then
            echo "═══════════════════════════════════════════"
            echo "MIGRATIONS FAILED. Fix above before merge."
            echo "═══════════════════════════════════════════"
            exit 1
          fi

      - name: Verify final schema has expected tables
        env:
          PGPASSWORD: postgres
        run: |
          # Smoke test: tabelele critice trebuie să existe după toate migrațiile
          REQUIRED_TABLES="restaurants tables products orders order_items qr_tokens bridge_devices pending_receipts restaurant_memberships"

          for tbl in $REQUIRED_TABLES; do
            COUNT=$(psql -h localhost -U postgres -d menuvia_test -tA -c \
              "select count(*) from information_schema.tables where table_schema='public' and table_name='$tbl';")
            if [ "$COUNT" != "1" ]; then
              echo "✗ Missing table: $tbl"
              exit 1
            fi
            echo "✓ Table exists: $tbl"
          done

      - name: Verify critical RPC functions exist
        env:
          PGPASSWORD: postgres
        run: |
          REQUIRED_FUNCS="create_order bridge_validate_device bridge_get_pending bridge_claim_receipt bridge_confirm_receipt"

          for fn in $REQUIRED_FUNCS; do
            COUNT=$(psql -h localhost -U postgres -d menuvia_test -tA -c \
              "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='$fn';")
            if [ "$COUNT" = "0" ]; then
              echo "✗ Missing function: $fn"
              exit 1
            fi
            echo "✓ Function exists: $fn (count: $COUNT)"
          done

      - name: Verify table GRANTs for authenticated
        # Static analysis al migrațiilor: detectează orice `create table public.X`
        # care nu are GRANT corespunzător pentru rolul `authenticated`. Previne
        # regresii de tipul "permission denied for table X" la onboarding/CRUD
        # (cauza fix-uită prin migrația 047).
        run: |
          set -euo pipefail
          cd supabase/migrations

          # Whitelist — tabele intenționat fără GRANT explicit pentru authenticated.
          # Adaugă aici DOAR dacă tabela este accesată exclusiv via:
          #   (A) service_role / Netlify Functions / webhook-uri, SAU
          #   (B) un VIEW dedicat care are propriul GRANT SELECT.
          NO_EXPLICIT_GRANT_REQUIRED="
            stripe_events
            invoices oblio_configs
            leads recrutare_leads
            email_queue lifecycle_events
            customer_health_scores ai_import_log
            function_rate_limits
            audit_log order_feedback
          "

          # Normalizează SQL-ul tuturor migrațiilor:
          #   - strip line-comments `--...`
          #   - flatten newlines (permite detectarea GRANT-urilor multi-line)
          #   - colapsează whitespace
          NORM=$(sed 's|--.*$||' *.sql | tr '\n' ' ' | tr -s ' ')

          # Extrage toate tabelele create în orice migrație
          CREATED=$(grep -hEi 'create table( if not exists)? public\.[a-z_]+' *.sql \
            | sed -E 's/.*public\.([a-z_]+).*/\1/' \
            | sort -u)

          if [ -z "$CREATED" ]; then
            echo "No tables found via CREATE TABLE public.* — nothing to verify."
            exit 0
          fi

          # Detectează grant global pe schema (acoperă toate tabelele dintr-un foc)
          if echo "$NORM" | grep -qiE 'grant[[:space:]]+[^;]+on[[:space:]]+all[[:space:]]+tables[[:space:]]+in[[:space:]]+schema[[:space:]]+public[[:space:]]+to[[:space:]]+[^;]*\bauthenticated\b'; then
            HAS_GLOBAL_GRANT=1
          else
            HAS_GLOBAL_GRANT=0
          fi

          # Iterează prin fiecare tabelă
          MISSING=()
          WHITELISTED=0
          COVERED=0

          for tbl in $CREATED; do
            # 1) Whitelist?
            if echo "$NO_EXPLICIT_GRANT_REQUIRED" | tr -s ' \n' ' ' | grep -qw "$tbl"; then
              echo "  · $tbl (whitelisted)"
              WHITELISTED=$((WHITELISTED + 1))
              continue
            fi

            # 2) Grant global pe ALL TABLES?
            if [ "$HAS_GLOBAL_GRANT" = "1" ]; then
              echo "  ✓ $tbl (covered by global ALL TABLES grant)"
              COVERED=$((COVERED + 1))
              continue
            fi

            # 3) Grant explicit pe această tabelă (singură sau în listă cu virgulă)?
            #    Pattern: `grant ... on (... )?public.$tbl(,| ) ... to ... authenticated`
            if echo "$NORM" | grep -qiE "grant[[:space:]]+[^;]+on[[:space:]]+([^;]+[, ]+)*(public\.)?${tbl}[^a-z_][^;]*to[[:space:]]+[^;]*\bauthenticated\b"; then
              echo "  ✓ $tbl (explicit grant)"
              COVERED=$((COVERED + 1))
              continue
            fi

            MISSING+=("$tbl")
          done

          echo ""
          echo "Summary: $COVERED granted, $WHITELISTED whitelisted, ${#MISSING[@]} missing"
          echo ""

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "═══════════════════════════════════════════════════════════════════"
            echo "MISSING GRANT for ${#MISSING[@]} table(s):"
            echo "═══════════════════════════════════════════════════════════════════"
            for t in "${MISSING[@]}"; do echo "  ✗ $t"; done
            echo ""
            echo "Fix options:"
            echo "  A) Add in a migration:"
            echo "     GRANT SELECT, INSERT, UPDATE, DELETE ON public.<table> TO authenticated;"
            echo "  B) Add the table to NO_EXPLICIT_GRANT_REQUIRED in this workflow"
            echo "     (only if accessed via service_role / SECURITY DEFINER RPC / dedicated VIEW)."
            echo ""
            echo "Context: lipsa unui GRANT pentru authenticated produce eroarea"
            echo "         'permission denied for table X' în Supabase proiecte fără"
            echo "         default privileges (cauza P0 fix-uită prin migrația 047)."
            exit 1
          fi

          echo "✓ All non-whitelisted tables have GRANT for authenticated"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-logs
          path: /tmp/migration-*.log
          retention-days: 7
