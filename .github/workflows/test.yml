name: Tests & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Declanșare manuală (diagnostic + validare pe branch când evenimentele nu ajung)
  workflow_dispatch:

# Anulează run-uri vechi pe același branch când vine push nou.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check (non-blocking — surfacing only)
        # Prettier are 20 fișiere cu formatting drift acumulat din PR-uri merged
        # cu CI roșu. Re-add ca blocking după ce rulezi `npm run format` într-un
        # commit dedicated cleanup.
        continue-on-error: true
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build are nevoie de env vars goale pentru a nu pica
          VITE_SUPABASE_URL: 'https://placeholder.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'placeholder'
          VITE_APP_URL: 'https://placeholder.netlify.app'

  # Testele bridge-ului (fiscal + tichete bucătărie) existau din mai dar NU
  # rulau în niciun workflow (finding-ul auditului aug 2026): componenta cu cea
  # mai mare expunere legală (bonul fiscal) depindea de disciplina manuală.
  # Zero dependențe (node --test pe built-ins), rulează pe mock — cost ~1s.
  bridge:
    name: Bridge tests (fiscal + kitchen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Bridge unit tests
        run: cd bridge && npm test
      # Funcțiile Netlify de BANI (stripe-webhook, table-payment,
      # oblio-generator) — aceeași disciplină zero-deps: harness Lambda-style
      # cu fake-uri pentru supabase-js/stripe injectate prin Module._load
      # (tests/functions/helpers/mocks.js). Vitest NU le vede (include-ul lui
      # e limitat la src/**), deci pasul de aici e SINGURUL care le rulează.
      - name: Money functions unit tests
        run: cd tests/functions && npm test
      # Logica pură a porții de securitate OSV (parsare lockfile, alias, CVSS,
      # strictețea răspunsului). Zero deps, fără rețea — api.osv.dev nu e
      # accesibil din containerul de dezvoltare, deci ASTA e singura acoperire
      # care poate rula și local, nu doar în CI.
      - name: OSV audit gate unit tests
        run: node --test tests/osv-gate/osv-audit.test.mjs

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund
      - run: npm run test:coverage

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
