version: 2
updates:
  # Npm dependencies pentru cloud
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    # Grupurile pe familii stau înaintea catch-all-ului minor+patch, DAR ordinea
    # singură NU e de ajuns: la reîmprospătarea unui PR de grup EXISTENT (#212,
    # rescanarea din 31 aug), dependabot i-a păstrat membership-ul vechi și
    # react-refresh 0.5.x („minor" breaking pe 0.x, cere peer eslint ^9||^10) a
    # rămas în minor+patch → ERESOLVE din nou. De aceea minor-and-patch EXCLUDE
    # explicit familiile de toolchain — excluderea nu depinde de ordine.
    groups:
      # Toolchain-ul de LINT se mișcă ÎMPREUNĂ, într-un singur grup: eslint 9/10
      # cere @typescript-eslint 8+ în ACELAȘI install (ts-eslint 6 are peer
      # eslint ^7||^8) — cu ts-eslint în grup separat, PR-ul de eslint ar fi el
      # însuși ne-instalabil. Include și perechea parser+plugin (auditul aug
      # 2026: #184/#186 separate erau nemergeabile individual) și react-refresh.
      eslint:
        patterns:
          - "eslint"
          - "eslint-plugin-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
      # Vite + pluginurile lui + VITEST vin ÎMPREUNĂ: @vitejs/plugin-react major
      # cere vite major (peer dep, #185), iar vitest are peer FIX pe majorul de
      # vite (vitest 2 cere vite ^5) — fără el în grup, PR-ul vite 8 (#219) a
      # picat la npm ci pe ERESOLVE. Majors-ii de vite/vitest migrează împreună.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      # Restul minorelor + patch-urilor vin într-un singur PR (anti-zgomot).
      # exclude-patterns ține familiile de toolchain AFARĂ chiar și când
      # dependabot nu re-evaluează ordinea grupurilor (vezi comentariul de sus).
      minor-and-patch:
        exclude-patterns:
          - "eslint"
          - "eslint-plugin-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
    # Ignor breaking changes pe React/TypeScript core — vrei să le revizuiești manual
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@supabase/supabase-js"
        update-types: ["version-update:semver-major"]
      # zod major: src/schemas/index.ts e cod speculativ (zero importuri în
      # producție, doar propria suită de teste) — zod 4 ar cere muncă pe cod
      # nefolosit. Se re-evaluează când schemele se cablează în formulare.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  # Netlify functions (Node)
  - package-ecosystem: "npm"
    directory: "/netlify/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
