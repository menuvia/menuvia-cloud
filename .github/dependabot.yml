version: 2
updates:
  # Npm dependencies pentru cloud
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    # Pentru a evita PR-uri minore care fac zgomot, grupez minor + patch împreună
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Ignor breaking changes pe React/TypeScript core — vrei să le revizuiești manual
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@supabase/supabase-js"
        update-types: ["version-update:semver-major"]

  # Netlify functions (Node)
  - package-ecosystem: "npm"
    directory: "/netlify/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "netlify-functions"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "ci"
