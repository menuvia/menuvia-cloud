version: 2
updates:
  # Npm dependencies pentru cloud
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    # Pentru a evita PR-uri minore care fac zgomot, grupez minor + patch împreună
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Majors pe perechea typescript-eslint vin ÎMPREUNĂ (parser + plugin
      # desincronizate = lint spart; auditul aug 2026 a găsit PR-urile #184/#186
      # separate, nemergeabile individual în siguranță).
      ts-eslint:
        patterns:
          - "@typescript-eslint/*"
      # Vite + pluginurile lui vin ÎMPREUNĂ: @vitejs/plugin-react major cere
      # vite major (peer dep) — separate (#185) sunt nemergeabile individual.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      # Toolchain-ul ESLint se mișcă ÎMPREUNĂ: primul PR regenerat al grupului
      # minor+patch (#212) a picat pe ERESOLVE — eslint-plugin-react-refresh
      # 0.5.x (0.x ⇒ „minorul" e breaking) cere peer eslint ^9||^10, repo-ul e
      # pe eslint 8. Grupat, pluginul vine odată cu majorul eslint, iar grupul
      # minor+patch rămâne instalabil.
      eslint:
        patterns:
          - "eslint"
          - "eslint-plugin-*"
          - "@eslint/*"
    # Ignor breaking changes pe React/TypeScript core — vrei să le revizuiești manual
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@supabase/supabase-js"
        update-types: ["version-update:semver-major"]
      # zod major: src/schemas/index.ts e cod speculativ (zero importuri în
      # producție, doar propria suită de teste) — zod 4 ar cere muncă pe cod
      # nefolosit. Se re-evaluează când schemele se cablează în formulare.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  # Netlify functions (Node)
  - package-ecosystem: "npm"
    directory: "/netlify/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
